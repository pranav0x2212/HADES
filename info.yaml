# Tiny Tapeout project information
project:
  title:        "HADES v0: SRAM-backed Hamming nearest-neighbour search"
  author:       "Pranav M"
  discord:      ""
  description:  "16-entry x 32-bit SRAM-backed masked Hamming distance search engine. Finds nearest neighbour and threshold-match bitmap over 16 entries."
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "2x2"

  top_module: "tt_um_hades_v0"

  source_files:
    - "tt_um_hades_v0.v"
    - "hades_v0_core.sv"
    - "sky130_sram_1rw_tiny_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins
  uio[0]: "strobe"
  uio[1]: "op[0]"
  uio[2]: "op[1]"
  uio[3]: "op[2]"
  uio[4]: ""
  uio[5]: "busy (output)"
  uio[6]: "done (output)"
  uio[7]: "any_hit (output)"

# Do not change!
yaml_version: 6
