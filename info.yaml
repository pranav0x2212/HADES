# Tiny Tapeout project information
project:
  title:        "HADES v1: PNM Hamming-search engine"
  author:       "Pranav M"
  discord:      "prawns_1205"
  description:  "16x32 masked Hamming/threshold/reduce search engine with a 32-instruction program"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "3x2"

  top_module: "tt_um_hades"

  # Generated SystemVerilog comes from the Veryl sources in src-veryl/ (`veryl build`).
  source_files:
    - "rf_top.v"
    - "tt_um_hades.v"
    - "hades_top.sv"
    - "ctrl.sv"
    - "compute.sv"
    - "regs.sv"
    - "result_regs.sv"
    - "hades_dupff.sv"

# Pin usage as implemented by src/tt_um_hades.v
pinout:
  # Inputs
  ui[0]: "data_in[0] (WAITBYTE byte / loader byte)"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Outputs
  uo[0]: "emit[0] (valid when READY)"
  uo[1]: "emit[1]"
  uo[2]: "emit[2]"
  uo[3]: "emit[3]"
  uo[4]: "emit[4]"
  uo[5]: "emit[5]"
  uo[6]: "emit[6]"
  uo[7]: "emit[7]"

  # Bidirectional pins
  uio[0]: "READY (output)"
  uio[1]: "BUSY (output)"
  uio[2]: "HALT (output)"
  uio[3]: "STROBE (input, WAITBYTE byte valid)"
  uio[4]: "LD_STROBE (input, program-loader byte valid, rising edge)"
  uio[5]: "EXECUTE (input, rising edge: start/restart at PC 0)"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
