name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        env:
          COCOTB_RESULTS_FILE: ${{ github.workspace }}/test/results.xml
        run: |
          cd test
          make clean
          make sim
          if [ ! -f "$COCOTB_RESULTS_FILE" ]; then
            echo "ERROR: results.xml not found at $COCOTB_RESULTS_FILE — simulation did not produce output"
            exit 1
          fi
          ! grep -E '<(failure|error)' "$COCOTB_RESULTS_FILE"

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
